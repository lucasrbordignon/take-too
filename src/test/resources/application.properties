spring.application.name=take-too-test

# DataSource H2 em modo PostgreSQL para isolamento total de testes
spring.datasource.url=jdbc:h2:mem:taketoo_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security Configuration - Chave de teste segura (>= 32 caracteres)
api.security.token.secret=test-secret-key-that-is-at-least-32-chars-long-for-testing-only

# CORS
api.cors.allowed-origins=http://localhost:3000,http://localhost:5173
