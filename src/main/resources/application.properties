spring.application.name=take-too

# PostgreSQL connection - exigido via variáveis de ambiente sem defaults inseguros
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security Configuration - sem fallback inseguro; validado no startup pelo TokenService
api.security.token.secret=${JWT_SECRET:}

# CORS Configuration
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Fluxo independente de vídeo: desativado até configurar o ambiente de validação.
app.video.enabled=${VIDEO_ENABLED:false}
app.video.provider=${VIDEO_PROVIDER:mux}
app.video.allowed-origins=${VIDEO_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.video.watermark-allowed-hosts=${VIDEO_WATERMARK_ALLOWED_HOSTS:}
app.video.playback-ttl-seconds=${VIDEO_PLAYBACK_TTL_SECONDS:3600}
app.video.mux.token-id=${MUX_TOKEN_ID:}
app.video.mux.token-secret=${MUX_TOKEN_SECRET:}
app.video.mux.webhook-secret=${MUX_WEBHOOK_SECRET:}
app.video.mux.signing-key-id=${MUX_SIGNING_KEY_ID:}
app.video.mux.signing-private-key=${MUX_SIGNING_PRIVATE_KEY:}
app.video.mux.upload-timeout-seconds=${MUX_UPLOAD_TIMEOUT_SECONDS:3600}

# Biblioteca privada de imagens (S3 por adaptador, desativada por padrão)
app.imagem.enabled=${IMAGEM_ENABLED:false}
app.imagem.provider=${IMAGEM_PROVIDER:s3}
app.imagem.max-bytes=${IMAGEM_MAX_BYTES:10485760}
app.imagem.max-pixels=${IMAGEM_MAX_PIXELS:25000000}
app.imagem.bucket=${IMAGEM_S3_BUCKET:}
app.imagem.region=${IMAGEM_S3_REGION:sa-east-1}
app.imagem.endpoint=${IMAGEM_S3_ENDPOINT:}
app.imagem.path-style=${IMAGEM_S3_PATH_STYLE:false}
