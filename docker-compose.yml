services:
  db:
    image: postgres:16-alpine
    container_name: taketoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB não definido}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME não definido}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não definido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taketoo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET não definido}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS não definido}
      VIDEO_ENABLED: ${VIDEO_ENABLED:-false}
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-mux}
      VIDEO_ALLOWED_ORIGINS: ${VIDEO_ALLOWED_ORIGINS:-http://localhost:5173}
      VIDEO_WATERMARK_ALLOWED_HOSTS: ${VIDEO_WATERMARK_ALLOWED_HOSTS:-}
      VIDEO_PLAYBACK_TTL_SECONDS: ${VIDEO_PLAYBACK_TTL_SECONDS:-3600}
      MUX_TOKEN_ID: ${MUX_TOKEN_ID:-}
      MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET:-}
      MUX_WEBHOOK_SECRET: ${MUX_WEBHOOK_SECRET:-}
      MUX_SIGNING_KEY_ID: ${MUX_SIGNING_KEY_ID:-}
      MUX_SIGNING_PRIVATE_KEY: ${MUX_SIGNING_PRIVATE_KEY:-}
      MUX_UPLOAD_TIMEOUT_SECONDS: ${MUX_UPLOAD_TIMEOUT_SECONDS:-3600}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  postgres_data:
